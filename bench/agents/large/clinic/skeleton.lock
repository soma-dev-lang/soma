        signal praticien(id: String) -> Map  reads praticiens
        signal existe_praticien(id: String) -> Bool  reads praticiens
        signal mettre_en_conge(id: String) -> Bool  reads praticiens  writes conges
        signal reprendre(id: String) -> Bool  reads praticiens  writes conges
