== Patients sha256:314927c6b2cbf86764086070c93856115f6ae79eb057e69d15cb5e3cbab6e771 core:bfaa7c5d4366833b409bc53428afea981113a9feee1946c280b615df75eb289e
skeleton Patients {
    memory {
        fiches: Map<String, Map> [persistent]
        actifs: Map<String, Bool> [persistent]
    }
    face {
        signal inscrire(id: String, nom: String, naissance: String) -> Map  writes actifs, fiches  calls Audit.consigner
        signal modifier_contact(id: String, tel: String) -> Map  writes fiches
        signal fiche(id: String) -> Map  reads fiches
        signal existe(id: String) -> Bool  reads fiches
        signal desactiver(id: String) -> Bool  reads fiches  writes actifs  calls Audit.consigner
        signal est_actif(id: String) -> Bool  reads actifs
        signal compter() -> Int  ensures result >= 0  reads fiches
    }
}

