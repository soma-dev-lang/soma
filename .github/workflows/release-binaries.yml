# Builds the soma binary for every platform the installer knows and attaches
# it to the GitHub release of the pushed tag (vX.Y.Z), then regenerates
# SHA256SUMS with every asset. site/setup.sh downloads
# soma-<arch>-<platform> from the latest release and verifies it against
# SHA256SUMS; a platform without a binary falls back to a source build.
name: release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing release tag to (re)build, e.g. v2.5.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: GMP and build tools
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y build-essential libgmp-dev m4
          else
            brew install gmp || true
          fi
      - uses: dtolnay/rust-toolchain@stable
      - name: build
        working-directory: compiler
        run: cargo build --release --locked
      - name: smoke test
        working-directory: compiler
        run: |
          ./target/release/soma --version
          ./target/release/soma init /tmp/demo >/dev/null
          ./target/release/soma check /tmp/demo/app.cell
          ./target/release/soma verify --strict /tmp/demo/app.cell
          ./target/release/soma test /tmp/demo/app.cell
      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp compiler/target/release/soma "soma-${{ matrix.target }}"
          gh release upload "$TAG" "soma-${{ matrix.target }}" --clobber

  checksums:
    needs: build
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: SHA256SUMS over every binary of the release
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p 'soma-*'
          sha256sum soma-* > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS -R "$GITHUB_REPOSITORY" --clobber
