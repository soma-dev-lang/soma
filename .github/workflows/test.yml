name: language tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential m4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compiler and runtime regressions
        working-directory: compiler
        run: cargo test --release --locked --no-fail-fast
      - name: Independent numeric reference
        env:
          SOMA: compiler/target/release/soma
        run: python3 tools/check_numeric_oracle.py
      - name: Published corpus and documentation examples
        env:
          SOMA: compiler/target/release/soma
        run: python3 tools/build_site.py
      - name: Skeleton and flesh — every program split and compared, frames against observed effects
        run: |
          python3 tools/split_roundtrip.py --soma compiler/target/release/soma
          python3 tools/frame_oracle.py --soma compiler/target/release/soma
          python3 tools/skeleton_monotone.py --soma compiler/target/release/soma
      - name: Core CLI fixtures
        run: bash tests/run_all.sh
