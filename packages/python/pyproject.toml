[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "soma-lang"
version = "3.1.0"
description = "Call a Soma program from Python: typed values in, typed values out, errors by kind"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[tool.setuptools]
packages = ["soma"]
