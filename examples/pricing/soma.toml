[package]
name = "pricing-engine"

[verify]
deadlock_free = true
eventually = ["confirmed", "cancelled", "eod_frozen"]

[verify.after.executed]
eventually = ["settled", "failed", "eod_frozen"]
# `never = ["cancelled"]` used to sit here and "pass" — the old check was
# vacuous. It is FALSE for this machine: executed → failed → pending →
# cancelled (a failed execution is retried from `pending`, where a trade can
# still be cancelled). If an executed trade must never be cancellable, the
# machine needs a retry state that has no edge to `cancelled`.

[verify.after.settled]
never = ["cancelled"]          # what does hold: a settled trade is never cancelled

[verify.after.failed]
eventually = ["pending", "eod_frozen"]

# ── Single machine mode (default) ────────────────────────────
# Nothing needed. Just run: soma serve app.cell

# ── Cluster mode (uncomment for distributed) ─────────────────
# [cluster]
# seeds = ["node1:8082", "node2:8082", "node3:8082"]
