== Desk sha256:ce87c2d29ba0ab8fea079fa7964c66b9e30eacdc80c3790e2a0fd2c656871b9a
skeleton Desk {
    memory {
        titles: Map<String, String> [persistent]
        owners: Map<String, String> [persistent]
        opened: Map<String, Int> [persistent]
        invariant opened >= 0
    }
    state ticket {
        initial: new
        new -> assigned
        assigned -> resolved
        resolved -> closed
        resolved -> assigned
        new -> closed
    }
    face {
        signal open(id: String, title: String) -> Map  writes opened, titles  calls count
        signal assign(id: String, owner: String) -> String
            reads titles
            writes owners
            moves new -> assigned
        signal resolve(id: String, by: String) -> String
            reads owners, titles
            moves assigned -> resolved
        signal reopen(id: String) -> String  moves resolved -> assigned
        signal close(id: String) -> String  reads titles  moves new -> closed, resolved -> closed
        signal summary(id: String) -> Map  reads owners, ticket, titles
        signal count() -> Int  reads opened
    }
}
