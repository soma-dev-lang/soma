== Counter sha256:94809de2333d2ec4d537479aa65dc4c485241cf62da3fec572376f86025fb771
skeleton Counter {
    memory {
        counts: Map<String, Int> [persistent]
        invariant counts >= 0 && counts <= 1000000
    }
    state session {
        initial: idle
        idle -> open
        open -> closed
    }
    face {
        signal total() -> Int  reads counts
        signal add(n: Int) -> Int  writes counts  calls total
        signal reset() -> Int  writes counts
        signal open_session(id: String) -> String  moves idle -> open
        signal close_session(id: String) -> String  moves open -> closed
        signal request(method: String, path: String, body: String) -> Map  calls add, total
    }
}

