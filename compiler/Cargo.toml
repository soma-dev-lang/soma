[package]
name = "soma"
version = "2.8.3"
license = "MIT"
repository = "https://github.com/soma-dev-lang/soma"
edition = "2021"
description = "The Soma language compiler — fractal, declarative, agent-native"

[dependencies]
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.2"
thiserror = "1"
miette = { version = "5", features = ["fancy"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
num-bigint = "0.4"
regex = "1"
num-traits = "0.2"
rug = "1"
tiny_http = "0.12"
rusqlite = { version = "0.31", features = ["bundled"] }
toml = "0.8"
ureq = { version = "2", features = ["json"] }
semver = "1"
tungstenite = "0.21"
url = "2"
rustc-hash = "1"
indexmap = "2"
libloading = "0.8"

# tiny_http 0.12.0 with one fix: EqualReader::drop drained the unread body
# with a single allocation of the DECLARED length (a 3-byte request declaring
# Content-Length 10^15 aborted `soma serve`). See vendor/tiny_http/SOMA_PATCH.
[patch.crates-io]
tiny_http = { path = "vendor/tiny_http" }
